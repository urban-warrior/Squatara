; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; ========================================================================
; [platformio] - Global Project Settings
; ========================================================================
[platformio]
default_envs = feather_esp32s3_revtft  ; Default environment to build/upload
description = A comprehensive boilerplate project template

; ========================================================================
; [env] - Shared configuration inherited by all environments
; ========================================================================
[env]
framework = arduino       ; Use the Arduino API layer
monitor_speed = 115200    ; Prevents garbage serial characters
;monitor_filters = colorize, esp32_exception_decoder ; Better terminal outputs

; Shared Library Dependencies (Auto-downloads from PlatformIO Registry)
;lib_deps =

[env:feather_esp32s3_revtft]
platform = espressif32
board = adafruit_feather_esp32s3_reversetft
framework = arduino

; --- Serial Monitor & Debugging Options ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
;monitor_port = /dev/ttyACMX   ; haven't been able to get monitor to work reliably

; --- Hardware & USB Build Flags ---
;build_unflags =
build_flags =
    -DBOARD_HAS_PSRAM                 ; Enables the onboard 2MB of PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Channels Serial output directly to the native USB port
    ;-UCORE_DEBUG_LEVEL
    ;-DCORE_DEBUG_LEVEL=3              ; 3 = Info level logs (0 = None, 5 = Verbose)
    ;-Wall -Wextra     ; only if want to see warnings in external code
    ;;-DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=0
    -DCONFIG_ESP32_REV_MIN=3
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DCLI_COMMANDS_MAX=20

build_src_flags = -Wall -Wextra
;board_build.extra_flags = -UCORE_DEBUG_LEVEL -DCORE_DEBUG_LEVEL=3

; --- Common Libraries for the Built-In TFT Screen ---
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit MAX1704X
    https://github.com/stm32duino/VL53L4CD.git
    https://github.com/FelipeDadison/DebugLogger.git
    https://github.com/fjulian79/libcli.git
